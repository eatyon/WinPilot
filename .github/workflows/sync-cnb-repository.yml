name: CNB Repository Sync
run-name: ${{ github.ref_type == 'tag' && format('CNB Tag {0}', github.ref_name) || github.event.head_commit.message || 'CNB Repository Sync' }}

on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:
  workflow_call:
    secrets:
      CNB_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: winpilot-cnb-repo
  cancel-in-progress: false

jobs:
  sync:
    if: vars.CNB_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: 同步分支和标签
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPOSITORY: ${{ vars.CNB_REPOSITORY }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CNB_TOKEN)) { throw '请配置 CNB_TOKEN Secret' }
          if ($env:CNB_REPOSITORY -notmatch '^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)+$' -or $env:CNB_REPOSITORY.Split('/') -contains '..') {
            throw 'CNB_REPOSITORY 必须为组织/仓库'
          }
          $githubCredential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GITHUB_TOKEN"))
          $cnbCredential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("cnb:$env:CNB_TOKEN"))
          Write-Output "::add-mask::$githubCredential"
          Write-Output "::add-mask::$cnbCredential"
          $env:GIT_CONFIG_COUNT = '2'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $githubCredential"
          $env:GIT_CONFIG_KEY_1 = 'http.https://cnb.cool/.extraheader'
          $env:GIT_CONFIG_VALUE_1 = "AUTHORIZATION: basic $cnbCredential"

          git fetch origin --prune --tags '+refs/heads/*:refs/remotes/origin/*'
          if ($LASTEXITCODE -ne 0) { throw '获取 GitHub 分支和标签失败' }
          $branches = @(git for-each-ref '--format=%(refname)' refs/remotes/origin/)
          if ($LASTEXITCODE -ne 0) { throw '读取 GitHub 分支失败' }
          $tags = @(git for-each-ref '--format=%(refname)' refs/tags/)
          if ($LASTEXITCODE -ne 0) { throw '读取 GitHub 标签失败' }
          $refspecs = @($branches | Where-Object { $_ -ne 'refs/remotes/origin/HEAD' } | ForEach-Object {
            "${_}:refs/heads/$($_.Substring('refs/remotes/origin/'.Length))"
          }) + @($tags | ForEach-Object { "${_}:$_" })
          if ($refspecs.Count -eq 0) { throw 'GitHub 仓库没有可同步的分支或标签' }
          git push "https://cnb.cool/$env:CNB_REPOSITORY" @refspecs
          if ($LASTEXITCODE -ne 0) { throw 'CNB 仓库同步失败，请检查权限及分支、标签是否存在冲突' }
          Write-Output "仓库已同步到 CNB：$env:CNB_REPOSITORY"
